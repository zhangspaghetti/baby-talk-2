name: Mobile PR Validation

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

on:
  pull_request:
    types: [closed]
    branches: [Release_QA]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-pr-validation.yml'
      - 'ci/mobile-*'

concurrency:
  group: mobile-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # -- Job 1: Static Analysis (2-3 min) --
  analyze:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            mobile/.dart_tool/
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Check formatting
        run: dart format --set-exit-if-changed mobile/

      - name: Run analyzer
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --fatal-infos

  # -- Job 2: Unit & Widget Tests (3-4 min) --
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            mobile/.dart_tool/
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Run tests with coverage
        working-directory: mobile
        run: |
          flutter pub get
          flutter test --coverage --reporter expanded

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage/lcov.info
          retention-days: 7

  # -- Job 3: Smoke Tests (2 min) --
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            mobile/.dart_tool/
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Run smoke tests
        working-directory: mobile
        run: |
          flutter pub get
          flutter test test/smoke/ --reporter expanded

  # -- Job 4: Android Build Check (3-4 min) --
  android-check:
    name: Android Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            mobile/.dart_tool/
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Build debug APK (compile check)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Check APK size
        run: |
          APK_SIZE=$(stat -c%s mobile/build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || stat -f%z mobile/build/app/outputs/flutter-apk/app-debug.apk)
          MAX_SIZE=$((100 * 1024 * 1024))  # 100 MB for debug
          echo "Debug APK size: $(( APK_SIZE / 1024 / 1024 )) MB (limit: $(( MAX_SIZE / 1024 / 1024 )) MB)"
          if [ "$APK_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::warning::Debug APK exceeds ${MAX_SIZE} bytes"
          fi
