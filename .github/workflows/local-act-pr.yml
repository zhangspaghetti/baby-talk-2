name: Local act PR validation

on:
  pull_request:
    branches: [Develop]

jobs:
  local-pr-full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a clean Git workspace for act
        id: prepare-act-workspace
        shell: bash
        run: |
          if [[ -d .git ]]; then
            printf 'ci_workspace=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ci_workspace="$(mktemp -d "${RUNNER_TEMP:-/tmp}/babytalk-act-workspace.XXXXXX")"
          tar --exclude=.git -cf - . | tar -xf - -C "$ci_workspace"
          git -C "$ci_workspace" init --quiet
          git -C "$ci_workspace" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$ci_workspace" fetch --no-tags origin Develop
          git -C "$ci_workspace" update-ref refs/heads/local-act origin/Develop
          git -C "$ci_workspace" symbolic-ref HEAD refs/heads/local-act
          git -C "$ci_workspace" read-tree origin/Develop
          git -C "$ci_workspace" add -A
          git -C "$ci_workspace" -c user.name=act -c user.email=act@local \
            commit --quiet --no-verify -m 'act workspace snapshot'
          printf 'ci_workspace=%s\n' "$ci_workspace" >> "$GITHUB_OUTPUT"
      - name: Run the authoritative complete local CI entrypoint
        working-directory: ${{ steps.prepare-act-workspace.outputs.ci_workspace }}
        run: bash ci/full-ci.sh
