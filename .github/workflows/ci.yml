name: CI

on:
  push:
    branches: [Develop, 'milestone/*']
  pull_request:
    branches: [Develop]

jobs:
  release-closure-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BABY_TALK_PLAYWRIGHT_SKIP_COMPOSE_BOOT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Test Spring AI 2 platform verifier
        run: python3 test/tool/verify_spring_ai_2_backend_platform_test.py

      - name: Verify Spring AI 2 backend platform
        run: python3 tool/verify_spring_ai_2_backend_platform.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Java toolchain contract
        run: |
          java -version 2>&1 | grep '21\.'
          grep -q '<java.version>17</java.version>' backend/pom.xml

      - name: Verify resolved Spring AI dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bash backend/mvnw -f backend/pom.xml -B -Dstyle.color=never dependency:tree \
            '-Dincludes=org.springframework.ai:*' | tee spring-ai-dependency-tree.txt
          python3 tool/verify_spring_ai_2_backend_platform.py \
            --dependency-tree spring-ai-dependency-tree.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install admin-web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm --dir admin-web exec playwright install chromium --with-deps

      - name: Start localhost:2375 Docker relay for Testcontainers
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          docker rm -f ci-docker-relay >/dev/null 2>&1 || true
          relay_container_id="$(docker run -d --name ci-docker-relay -p 2375:2375 -v /var/run/docker.sock:/var/run/docker.sock alpine/socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock)"
          echo "Started Docker relay container: ${relay_container_id}"
          for attempt in {1..20}; do
            if docker --host tcp://localhost:2375 info >/dev/null 2>&1; then
              echo 'Docker relay is reachable at tcp://localhost:2375.'
              docker --host tcp://localhost:2375 info --format 'ServerVersion={{.ServerVersion}}'
              exit 0
            fi
            sleep 1
          done
          echo '::error::Docker relay did not become ready at tcp://localhost:2375 within 20s.'
          docker ps -a || true
          docker logs ci-docker-relay || true
          exit 1

      - name: Run backend tests
        id: backend_tests
        continue-on-error: true
        timeout-minutes: 45
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: bash ci/backend-test.sh

      - name: Run checkstyle
        id: checkstyle
        continue-on-error: true
        timeout-minutes: 10
        run: bash backend/mvnw -f backend/pom.xml -B checkstyle:check

      - name: Upload JaCoCo coverage
        if: ${{ always() }}
        uses: codecov/codecov-action@v4
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
          thresholds: '70'

      - name: Dump Docker relay diagnostics
        if: ${{ always() && steps.backend_tests.outcome != 'success' }}
        shell: bash
        run: |
          docker ps -a || true
          docker logs ci-docker-relay || true

      - name: Stop Docker relay
        if: ${{ always() }}
        run: docker rm -f ci-docker-relay >/dev/null 2>&1 || true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Helm dual-chart smoke (babytalk-infra + babytalk-app)
        id: helm_smoke
        continue-on-error: true
        timeout-minutes: 20
        run: bash ci/k8s-smoke.sh

      - name: Upload playwright-report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 7
          if-no-files-found: warn
          path: |
            admin-web/playwright-report
            admin-web/test-results

      - name: Fail when backend tests, checkstyle, or Helm smoke fail
        if: ${{ steps.backend_tests.outcome != 'success' || steps.checkstyle.outcome != 'success' || steps.helm_smoke.outcome != 'success' }}
        shell: bash
        run: |
          if [[ "${{ steps.backend_tests.outcome }}" != 'success' ]]; then
            echo '::error::bash ci/backend-test.sh failed.'
          fi
          if [[ "${{ steps.checkstyle.outcome }}" != 'success' ]]; then
            echo '::error::mvn checkstyle:check failed.'
          fi
          if [[ "${{ steps.helm_smoke.outcome }}" != 'success' ]]; then
            echo '::error::bash ci/k8s-smoke.sh failed.'
          fi
          exit 1

  mobile-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run mobile analysis
        run: bash ci/mobile-analyze.sh

      - name: Run mobile R4 release gates
        run: bash ci/mobile-r4-release-gates.sh
