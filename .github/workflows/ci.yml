name: CI

on:
  push:
    branches: [main, 'milestone/*']
  pull_request:
    branches: [main]

jobs:
  release-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install admin-web dependencies
        run: npm --prefix admin-web ci

      - name: Install Playwright Chromium
        working-directory: admin-web
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      - name: Start localhost:2375 Docker relay for Testcontainers
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          docker rm -f ci-docker-relay >/dev/null 2>&1 || true
          relay_container_id="$(docker run -d --name ci-docker-relay -p 2375:2375 -v /var/run/docker.sock:/var/run/docker.sock alpine/socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock)"
          echo "Started Docker relay container: ${relay_container_id}"
          for attempt in {1..20}; do
            if docker --host tcp://localhost:2375 info >/dev/null 2>&1; then
              echo 'Docker relay is reachable at tcp://localhost:2375.'
              docker --host tcp://localhost:2375 info --format 'ServerVersion={{.ServerVersion}}'
              exit 0
            fi
            sleep 1
          done
          echo '::error::Docker relay did not become ready at tcp://localhost:2375 within 20s.'
          docker ps -a || true
          docker logs ci-docker-relay || true
          exit 1

      - name: Run M006 S08 full release verifier
        id: release_gate
        continue-on-error: true
        timeout-minutes: 45
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: dart run tool/verify_m006_s08_release.dart

      - name: Upload playwright-report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 7
          if-no-files-found: error
          path: |
            admin-web/playwright-report
            admin-web/test-results

      - name: Dump Docker relay diagnostics
        if: ${{ always() && steps.release_gate.outcome != 'success' }}
        shell: bash
        run: |
          docker ps -a || true
          docker logs ci-docker-relay || true

      - name: Stop Docker relay
        if: ${{ always() }}
        run: docker rm -f ci-docker-relay >/dev/null 2>&1 || true

      - name: Fail when full release verifier fails
        if: ${{ steps.release_gate.outcome != 'success' }}
        run: |
          echo '::error::dart run tool/verify_m006_s08_release.dart failed.'
          exit 1

  mobile-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run mobile analysis
        run: bash ci/mobile-analyze.sh
