name: admin-web

on:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix admin-web run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix admin-web run lint
      - run: npm --prefix admin-web run format

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix admin-web run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix admin-web run install:browsers
      - run: npm --prefix admin-web run test:e2e:p0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix admin-web run build
