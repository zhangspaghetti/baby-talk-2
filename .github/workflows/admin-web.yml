name: admin-web

env:
  NPM_CONFIG_REGISTRY: https://mirrors.cloud.tencent.com/npm/
  npm_config_registry: https://mirrors.cloud.tencent.com/npm/
  COREPACK_NPM_REGISTRY: https://mirrors.cloud.tencent.com/npm/
  PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright

on:
  pull_request:
    types: [closed]
    branches: [Release_QA]
    paths:
      - 'admin-web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-web.yml'

jobs:
  typecheck:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web typecheck

  lint:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web lint
      - run: pnpm --filter admin-web format

  unit:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web test:coverage

  e2e:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web install:browsers
      - run: pnpm --filter admin-web test:e2e:p0

  build:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'Develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web build
