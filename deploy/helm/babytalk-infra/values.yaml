postgres:
  image:
    repository: pgvector/pgvector
    tag: pg17
  auth:
    database: babytalk
    username: babytalk
    password: babytalk
  primary:
    resources: {}
    persistence:
      # false = emptyDir (local dev default; data cleared on pod restart)
      # true  = PVC (staging / prod; set storageClassName + size appropriately)
      enabled: false
      storageClassName: ""  # e.g. "hostpath" for Docker Desktop, "" uses cluster default
      size: 1Gi

redis:
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0
    persistence:
      enabled: false

minio:
  image:
    repository: minio/minio
    tag: latest
  auth:
    rootUser: babytalk
    rootPassword: babytalk123
  defaultBuckets: babytalk
  persistence:
    # false = emptyDir (local dev default; data cleared on pod restart)
    # true  = PVC (staging / prod; set storageClassName + size appropriately)
    enabled: false
    storageClassName: ""  # e.g. "hostpath" for Docker Desktop, "" uses cluster default
    size: 5Gi
