apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "babytalk.fullname" . }}-test-connection"
  labels:
    {{- include "babytalk.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "babytalk.fullname" . }}:{{ .Values.service.port }}/actuator/health', '-q', '-O-', '--timeout=10']
  restartPolicy: Never
