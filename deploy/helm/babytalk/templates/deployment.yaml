apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "babytalk.componentFullname" (dict "root" . "component" "admin-web") }}
  labels:
    {{- include "babytalk.componentLabels" (dict "root" . "component" "admin-web") | nindent 4 }}
spec:
  replicas: {{ .Values.adminWeb.replicaCount }}
  selector:
    matchLabels:
      {{- include "babytalk.componentSelectorLabels" (dict "root" . "component" "admin-web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "babytalk.componentLabels" (dict "root" . "component" "admin-web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "babytalk.serviceAccountName" . }}
      {{- with .Values.adminWeb.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-web
          image: "{{ required "adminWeb.image.repository is required" .Values.adminWeb.image.repository }}:{{ required "adminWeb.image.tag is required" .Values.adminWeb.image.tag }}"
          imagePullPolicy: {{ .Values.adminWeb.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          {{- with .Values.adminWeb.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.adminWeb.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.adminWeb.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.adminWeb.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.adminWeb.resources | nindent 12 }}
      volumes:
        - name: proxy-config
          configMap:
            name: {{ include "babytalk.adminWebProxyConfigMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "babytalk.componentFullname" (dict "root" . "component" "db-migration") }}
  labels:
    {{- include "babytalk.componentLabels" (dict "root" . "component" "db-migration") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbMigration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.dbMigration.activeDeadlineSeconds }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "babytalk.componentLabels" (dict "root" . "component" "db-migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "babytalk.serviceAccountName" . }}
      {{- with .Values.dbMigration.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-migration
          image: "{{ required "dbMigration.image.repository is required" .Values.dbMigration.image.repository }}:{{ required "dbMigration.image.tag is required" .Values.dbMigration.image.tag }}"
          imagePullPolicy: {{ .Values.dbMigration.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "babytalk.secretName" . }}
          {{- with .Values.dbMigration.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.dbMigration.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
