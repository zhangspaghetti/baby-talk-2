apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "babytalk.componentFullname" (dict "root" . "component" "app-api") }}
  labels:
    {{- include "babytalk.componentLabels" (dict "root" . "component" "app-api") | nindent 4 }}
spec:
  replicas: {{ .Values.appApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "babytalk.componentSelectorLabels" (dict "root" . "component" "app-api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "babytalk.componentLabels" (dict "root" . "component" "app-api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "babytalk.serviceAccountName" . }}
      {{- with .Values.appApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app-api
          image: "{{ required "appApi.image.repository is required" .Values.appApi.image.repository }}:{{ required "appApi.image.tag is required" .Values.appApi.image.tag }}"
          imagePullPolicy: {{ .Values.appApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.appApi.service.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.appApi.service.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "babytalk.configMapName" . }}
            - secretRef:
                name: {{ include "babytalk.secretName" . }}
          {{- with .Values.appApi.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.appApi.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.appApi.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.appApi.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.appApi.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
