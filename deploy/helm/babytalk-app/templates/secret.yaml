apiVersion: v1
kind: Secret
metadata:
  name: {{ include "babytalk-app.secretName" . }}
  labels:
    {{- include "babytalk-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  BABY_TALK_DB_URL: {{ required "secret.BABY_TALK_DB_URL is required" .Values.secret.BABY_TALK_DB_URL | b64enc | quote }}
  BABY_TALK_DB_USERNAME: {{ required "secret.BABY_TALK_DB_USERNAME is required" .Values.secret.BABY_TALK_DB_USERNAME | b64enc | quote }}
  BABY_TALK_DB_PASSWORD: {{ required "secret.BABY_TALK_DB_PASSWORD is required" .Values.secret.BABY_TALK_DB_PASSWORD | b64enc | quote }}
  BABY_TALK_CONSUMER_JWT_SECRET: {{ required "secret.BABY_TALK_CONSUMER_JWT_SECRET is required" .Values.secret.BABY_TALK_CONSUMER_JWT_SECRET | b64enc | quote }}
  BABY_TALK_AI_API_KEY: {{ required "secret.BABY_TALK_AI_API_KEY is required" .Values.secret.BABY_TALK_AI_API_KEY | b64enc | quote }}
  BABY_TALK_MINIO_ENDPOINT: {{ required "secret.BABY_TALK_MINIO_ENDPOINT is required" .Values.secret.BABY_TALK_MINIO_ENDPOINT | b64enc | quote }}
  BABY_TALK_MINIO_ACCESS_KEY: {{ required "secret.BABY_TALK_MINIO_ACCESS_KEY is required" .Values.secret.BABY_TALK_MINIO_ACCESS_KEY | b64enc | quote }}
  BABY_TALK_MINIO_SECRET_KEY: {{ required "secret.BABY_TALK_MINIO_SECRET_KEY is required" .Values.secret.BABY_TALK_MINIO_SECRET_KEY | b64enc | quote }}
  BABY_TALK_MINIO_BUCKET: {{ required "secret.BABY_TALK_MINIO_BUCKET is required" .Values.secret.BABY_TALK_MINIO_BUCKET | b64enc | quote }}
  BABY_TALK_EMBEDDING_API_KEY: {{ required "secret.BABY_TALK_EMBEDDING_API_KEY is required" .Values.secret.BABY_TALK_EMBEDDING_API_KEY | b64enc | quote }}
  BABY_TALK_ADMIN_JWT_SECRET: {{ required "secret.BABY_TALK_ADMIN_JWT_SECRET is required" .Values.secret.BABY_TALK_ADMIN_JWT_SECRET | b64enc | quote }}
  BABY_TALK_ADMIN_BOOTSTRAP_PASSWORD: {{ required "secret.BABY_TALK_ADMIN_BOOTSTRAP_PASSWORD is required" .Values.secret.BABY_TALK_ADMIN_BOOTSTRAP_PASSWORD | b64enc | quote }}
