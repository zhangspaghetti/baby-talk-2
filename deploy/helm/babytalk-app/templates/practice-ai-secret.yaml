{{- if eq .Values.practiceAi.providerMode "agentic" -}}
{{- $existingSecret := default "" .Values.practiceAi.secret.existingSecret -}}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "babytalk-app.practiceAiSecretName" . }}
  labels:
    {{- include "babytalk-app.componentLabels" (dict "root" . "component" "app-api") | nindent 4 }}
type: Opaque
data:
  {{- range $providerName, $provider := .Values.practiceAi.providers }}
  {{- $environmentVariable := required (printf "provider %s apiKeyEnvironmentVariable is required" $providerName) $provider.apiKeyEnvironmentVariable }}
  {{ $environmentVariable }}: {{ required (printf "practiceAi.secret.values.%s is required when existingSecret is empty" $environmentVariable) (index $.Values.practiceAi.secret.values $environmentVariable) | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
