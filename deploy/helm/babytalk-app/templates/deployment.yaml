---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "babytalk-app.componentFullname" (dict "root" . "component" "db-migration") }}
  labels:
    {{- include "babytalk-app.componentLabels" (dict "root" . "component" "db-migration") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbMigration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.dbMigration.activeDeadlineSeconds }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "babytalk-app.componentLabels" (dict "root" . "component" "db-migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "babytalk-app.serviceAccountName" . }}
      {{- with .Values.dbMigration.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-migration
          image: "{{ required "dbMigration.image.repository is required" .Values.dbMigration.image.repository }}:{{ required "dbMigration.image.tag is required" .Values.dbMigration.image.tag }}"
          imagePullPolicy: {{ .Values.dbMigration.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "babytalk-app.secretName" . }}
          {{- with .Values.dbMigration.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.dbMigration.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
