apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "babytalk-app.componentFullname" (dict "root" . "component" "app-api") }}
  labels:
    {{- include "babytalk-app.componentLabels" (dict "root" . "component" "app-api") | nindent 4 }}
spec:
  replicas: {{ .Values.appApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "babytalk-app.componentSelectorLabels" (dict "root" . "component" "app-api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/practice-ai-runtime: {{ include (print $.Template.BasePath "/practice-ai-configmap.yaml") . | sha256sum }}
        {{ if eq .Values.practiceAi.providerMode "agentic" }}
        {{ if .Values.practiceAi.secret.existingSecret }}
        rollout/practice-ai-secret: {{ required "practiceAi.secret.rolloutVersion is required when existingSecret is set" .Values.practiceAi.secret.rolloutVersion | quote }}
        {{ else }}
        checksum/practice-ai-secret: {{ include (print $.Template.BasePath "/practice-ai-secret.yaml") . | sha256sum }}
        {{ end }}
        {{ end }}
      labels:
        {{- include "babytalk-app.componentLabels" (dict "root" . "component" "app-api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "babytalk-app.serviceAccountName" . }}
      {{- with .Values.appApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app-api
          image: "{{ required "appApi.image.repository is required" .Values.appApi.image.repository }}:{{ required "appApi.image.tag is required" .Values.appApi.image.tag }}"
          imagePullPolicy: {{ .Values.appApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.appApi.service.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.appApi.service.port | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /config/practice-ai-runtime.yml
            {{- if .Values.practiceAi.springProfilesActive }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.practiceAi.springProfilesActive | quote }}
            {{- end }}
            {{- if eq .Values.practiceAi.providerMode "agentic" }}
            {{- $practiceAiSecretName := default (include "babytalk-app.practiceAiSecretName" .) .Values.practiceAi.secret.existingSecret }}
            - name: BABY_TALK_PRACTICE_DISCOVERY_OWNER_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "babytalk-app.practiceDiscoveryOwnerKeySecretName" . }}
                  key: BABY_TALK_PRACTICE_DISCOVERY_OWNER_KEY_SECRET
            {{- range $providerName, $provider := .Values.practiceAi.providers }}
            - name: {{ required (printf "provider %s apiKeyEnvironmentVariable is required" $providerName) $provider.apiKeyEnvironmentVariable }}
              valueFrom:
                secretKeyRef:
                  name: {{ $practiceAiSecretName }}
                  key: {{ $provider.apiKeyEnvironmentVariable }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "babytalk-app.configMapName" . }}
            - secretRef:
                name: {{ include "babytalk-app.secretName" . }}
          {{- with .Values.appApi.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.appApi.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.appApi.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.appApi.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.appApi.resources | nindent 12 }}
          volumeMounts:
            - name: practice-ai-runtime
              mountPath: /config/practice-ai-runtime.yml
              subPath: practice-ai-runtime.yml
              readOnly: true
      volumes:
        - name: practice-ai-runtime
          configMap:
            name: {{ include "babytalk-app.practiceAiRuntimeConfigMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
