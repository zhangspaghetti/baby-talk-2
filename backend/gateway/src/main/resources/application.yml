server:
  port: 8090

spring:
  application:
    name: babytalk-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${BABY_TALK_ADMIN_WEB_ORIGIN:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: admin-api
          uri: ${BABY_TALK_ADMIN_API_URI:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
        - id: app-api-consumer
          uri: ${BABY_TALK_APP_API_URI:http://localhost:8080}
          predicates:
            - Path=/api/v1/**
        - id: app-api-public
          uri: ${BABY_TALK_APP_API_URI:http://localhost:8080}
          predicates:
            - Path=/download/**,/upgrade/**,/share/**,/invite/**
  data:
    redis:
      host: ${BABY_TALK_REDIS_HOST:localhost}
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  gateway:
    admin-jwt-secret: ${BABY_TALK_ADMIN_JWT_SECRET}
    admin-jwt-issuer: ${BABY_TALK_ADMIN_JWT_ISSUER:babytalk-admin-api}
