spring:
  application:
    name: babytalk-db-migration
  main:
    web-application-type: none
  datasource:
    url: ${BABY_TALK_DB_URL:jdbc:postgresql://localhost:15432/babytalk}
    username: ${BABY_TALK_DB_USERNAME:babytalk}
    password: ${BABY_TALK_DB_PASSWORD:babytalk}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    org.flywaydb: info
