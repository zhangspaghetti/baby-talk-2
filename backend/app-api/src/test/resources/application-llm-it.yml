# Profile: llm-it — 使用 SSY (胜算云) 中转站调用真实 LLM API
# 需要环境变量: SSY_API_KEY
# 使用方式: SSY_API_KEY=sk-xxx ./mvnw test -Dgroups="llm-it"
app:
  mentor:
    provider-mode: openai
    ai-base-url: https://router.shengsuanyun.com/api
    ai-api-key: ${SSY_API_KEY:}
    ai-model: openai/gpt-5-nano
    ai-max-tokens: 1500     # 推理模型 gpt-5-nano 会先消耗 reasoning_tokens，需预留足够空间给实际响应
    ai-temperature: 0.5
    provider-timeout: PT20S
  embedding:
    base-url: https://router.shengsuanyun.com/api
    api-key: ${SSY_API_KEY:}
    model: openai/text-embedding-3-small
    dimensions: 1536
