spring:
  application:
    name: babytalk-app-api
  config:
    import: classpath:config/practice-discovery-policy.yml
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: ${BABY_TALK_DB_URL:jdbc:postgresql://localhost:15432/babytalk}
    username: ${BABY_TALK_DB_USERNAME:babytalk}
    password: ${BABY_TALK_DB_PASSWORD:babytalk}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
  flyway:
    enabled: false
    baseline-on-migrate: false
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 200ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

babytalk:
  practice:
    generated-audio:
      enabled: ${BABY_TALK_GENERATED_AUDIO_ENABLED:false}
      provider-mode: ${BABY_TALK_GENERATED_AUDIO_PROVIDER_MODE:disabled}
      timeout: ${BABY_TALK_GENERATED_AUDIO_TIMEOUT:5s}
      max-bytes: ${BABY_TALK_GENERATED_AUDIO_MAX_BYTES:524288}
      voice-version: ${BABY_TALK_GENERATED_AUDIO_VOICE_VERSION:generated-tts-v1}
      format: ${BABY_TALK_GENERATED_AUDIO_FORMAT:mp3}
      base-url: ${BABY_TALK_GENERATED_AUDIO_BASE_URL:}
      api-key-environment-variable: ${BABY_TALK_GENERATED_AUDIO_API_KEY_ENVIRONMENT_VARIABLE:}
      model: ${BABY_TALK_GENERATED_AUDIO_MODEL:}
      voice: ${BABY_TALK_GENERATED_AUDIO_VOICE:}
      provider-profile: ${BABY_TALK_GENERATED_AUDIO_PROVIDER_PROFILE:default}
    agentic:
      versioned-resources:
        profile: ${BABY_TALK_PRACTICE_AI_PROFILE:classpath:config/practice-ai/profiles/custom-scene-generation-v3.yml}
    discovery:
      custom-scene:
        enabled: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_ENABLED:false}
        timeout: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_TIMEOUT:5s}
        prompt-version: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_PROMPT_VERSION:practice-custom-scene-v1}
        strategy-version: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_STRATEGY_VERSION:fake-generator-v1}
        provider-mode: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_PROVIDER_MODE:disabled}
        installation-burst-limit: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_INSTALLATION_BURST_LIMIT:3}
        installation-daily-limit: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_INSTALLATION_DAILY_LIMIT:10}
        account-burst-limit: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_ACCOUNT_BURST_LIMIT:5}
        account-daily-limit: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_ACCOUNT_DAILY_LIMIT:20}
        burst-window: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_BURST_WINDOW:10m}
        daily-window: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_DAILY_WINDOW:1d}
        max-generation-attempts: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_MAX_GENERATION_ATTEMPTS:2}
        generation-lease: ${BABY_TALK_PRACTICE_DISCOVERY_CUSTOM_SCENE_GENERATION_LEASE:5m}

app:
  auth:
    issuer: ${BABY_TALK_CONSUMER_JWT_ISSUER:babytalk-app-api}
    jwt-secret: ${BABY_TALK_CONSUMER_JWT_SECRET}
    access-token-ttl: ${BABY_TALK_CONSUMER_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${BABY_TALK_CONSUMER_REFRESH_TOKEN_TTL:P30D}
  contract:
    min-supported-version: ${BABY_TALK_MIN_SUPPORTED_VERSION:1.2.0}
    upgrade-url: ${BABY_TALK_UPGRADE_URL:https://example.com/baby-talk/upgrade?channel=stable&source=version_gate}
    sync-max-batch-size: ${BABY_TALK_SYNC_MAX_BATCH_SIZE:100}
    bootstrap-max-events: ${BABY_TALK_BOOTSTRAP_MAX_EVENTS:200}
  distribution:
    default-channel: stable
    download-default-source: public_link
    upgrade-default-source: version_gate
    allowed-sources:
      - public_link
      - version_gate
      - share_card
      - caregiver_invite
      - manual_retry
    channels:
      stable:
        label: 正式版
        platforms:
          android: ${BABY_TALK_ANDROID_STABLE_URL:https://download.example.com/android/stable/babytalk.apk}
          ios: ${BABY_TALK_IOS_STABLE_URL:https://apps.apple.com/app/id0000000000}
      beta:
        label: 测试版
        platforms:
          android: ${BABY_TALK_ANDROID_BETA_URL:https://download.example.com/android/beta/babytalk.apk}
  share:
    landing:
      public-base-url: ${BABY_TALK_SHARE_PUBLIC_BASE_URL:https://share.example.com}
      default-link-ttl: ${BABY_TALK_SHARE_LINK_TTL:PT168H}
      download-fallback-path: /download
      download-fallback-source: share_card
      allowed-sources:
        - latest_impact
        - continuity_recommendation
        - paired_progress
      open-app-targets:
        android: ${BABY_TALK_ANDROID_OPEN_SHARE_URL:babytalk://share/open}
        ios: ${BABY_TALK_IOS_OPEN_SHARE_URL:babytalk://share/open}
  caregiver-invite:
    public-base-url: ${BABY_TALK_CAREGIVER_INVITE_PUBLIC_BASE_URL:https://invite.example.com}
    default-link-ttl: ${BABY_TALK_CAREGIVER_INVITE_TTL:PT72H}
    download-fallback-path: /download
    download-fallback-source: caregiver_invite
    allowed-roles:
      - caregiver
    allowed-sources:
      - household_settings
      - invite_banner
      - invite_link
    open-app-targets:
      android: ${BABY_TALK_ANDROID_OPEN_INVITE_URL:babytalk://invite/open}
      ios: ${BABY_TALK_IOS_OPEN_INVITE_URL:babytalk://invite/open}
  sms:
    provider-mode: ${BABY_TALK_SMS_PROVIDER_MODE:dev}
    dev-code: ${BABY_TALK_SMS_DEV_CODE:246810}
    challenge-ttl: ${BABY_TALK_SMS_CHALLENGE_TTL:PT5M}
    simulate-timeout: ${BABY_TALK_SMS_SIMULATE_TIMEOUT:false}
  mentor:
    provider-mode: ${BABY_TALK_MENTOR_PROVIDER_MODE:dev}
    provider-timeout: ${BABY_TALK_MENTOR_PROVIDER_TIMEOUT:PT4S}
    ai-base-url: ${BABY_TALK_AI_BASE_URL:https://models.inference.ai.azure.com}
    ai-api-key: ${BABY_TALK_AI_API_KEY:}
    ai-model: ${BABY_TALK_AI_MODEL:gpt-4o-mini}
    ai-temperature: ${BABY_TALK_AI_TEMPERATURE:0.7}
    ai-max-tokens: ${BABY_TALK_AI_MAX_TOKENS:300}
    ai-max-attempts: ${BABY_TALK_AI_MAX_ATTEMPTS:10}
    rate-limit-max-requests: ${BABY_TALK_MENTOR_RATE_LIMIT_MAX_REQUESTS:3}
    rate-limit-window: ${BABY_TALK_MENTOR_RATE_LIMIT_WINDOW:PT10M}
    prompt-max-length: ${BABY_TALK_MENTOR_PROMPT_MAX_LENGTH:280}
    response-max-length: ${BABY_TALK_MENTOR_RESPONSE_MAX_LENGTH:280}
    allowed-surfaces:
      - home
      - discover
      - garden
      - growth
      - standalone_home
      - practice
    allowed-modes:
      - single_turn
      - multi_turn
    blocked-keywords:
      - slap
      - hit
      - 体罚
      - 羞辱
      - 打宝宝
    simulate-timeout-token: ${BABY_TALK_MENTOR_SIMULATE_TIMEOUT_TOKEN:[timeout]}
    simulate-malformed-token: ${BABY_TALK_MENTOR_SIMULATE_MALFORMED_TOKEN:[malformed]}
    simulate-unavailable-token: ${BABY_TALK_MENTOR_SIMULATE_UNAVAILABLE_TOKEN:[unavailable]}
    search-mode: ${BABY_TALK_MENTOR_SEARCH_MODE:none}
    session-timeout: ${BABY_TALK_MENTOR_SESSION_TIMEOUT:PT30M}
    practice-response-max-length: ${BABY_TALK_MENTOR_PRACTICE_RESPONSE_MAX_LENGTH:2000}
  embedding:
    mode: ${BABY_TALK_EMBEDDING_MODE:openai}
    base-url: ${BABY_TALK_EMBEDDING_BASE_URL:https://models.inference.ai.azure.com}
    api-key: ${BABY_TALK_EMBEDDING_API_KEY:}
    model: ${BABY_TALK_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${BABY_TALK_EMBEDDING_DIMENSIONS:1536}
  kg:
    review-interval: ${BABY_TALK_KG_REVIEW_INTERVAL:PT5M}
    review-enabled: ${BABY_TALK_KG_REVIEW_ENABLED:true}
    review-batch-size: ${BABY_TALK_KG_REVIEW_BATCH_SIZE:10}
  minio:
    endpoint: ${BABY_TALK_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BABY_TALK_MINIO_ACCESS_KEY:babytalk}
    secret-key: ${BABY_TALK_MINIO_SECRET_KEY:babytalk123}
    bucket-name: ${BABY_TALK_MINIO_BUCKET:babytalk}
