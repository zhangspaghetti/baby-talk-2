server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: babytalk-admin-api
  datasource:
    url: ${BABY_TALK_DB_URL:jdbc:postgresql://localhost:15432/babytalk}
    username: ${BABY_TALK_DB_USERNAME:babytalk}
    password: ${BABY_TALK_DB_PASSWORD:babytalk}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    sensitive-data-pepper: ${BABY_TALK_AUTH_SENSITIVE_DATA_PEPPER}
  embedding:
    mode: ${BABY_TALK_EMBEDDING_MODE:openai}
    base-url: ${BABY_TALK_EMBEDDING_BASE_URL:https://models.inference.ai.azure.com}
    api-key: ${BABY_TALK_EMBEDDING_API_KEY:}
    model: ${BABY_TALK_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${BABY_TALK_EMBEDDING_DIMENSIONS:1536}
  minio:
    endpoint: ${BABY_TALK_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BABY_TALK_MINIO_ACCESS_KEY:babytalk}
    secret-key: ${BABY_TALK_MINIO_SECRET_KEY:babytalk123}
    bucket-name: ${BABY_TALK_MINIO_BUCKET:babytalk}
  admin:
    auth:
      issuer: ${BABY_TALK_ADMIN_JWT_ISSUER:babytalk-admin-api}
      jwt-secret: ${BABY_TALK_ADMIN_JWT_SECRET}
      access-token-ttl: ${BABY_TALK_ADMIN_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${BABY_TALK_ADMIN_REFRESH_TOKEN_TTL:P7D}
      bootstrap:
        enabled: ${BABY_TALK_ADMIN_BOOTSTRAP_ENABLED:true}
        username: ${BABY_TALK_ADMIN_BOOTSTRAP_USERNAME:super_admin}
        password: ${BABY_TALK_ADMIN_BOOTSTRAP_PASSWORD:SuperAdmin123!}
        display-name: ${BABY_TALK_ADMIN_BOOTSTRAP_DISPLAY_NAME:Super Admin}
    mentor-audit:
      default-limit: ${BABY_TALK_ADMIN_MENTOR_AUDIT_DEFAULT_LIMIT:50}
      max-limit: ${BABY_TALK_ADMIN_MENTOR_AUDIT_MAX_LIMIT:100}
      rate-limit-max-requests: ${BABY_TALK_MENTOR_RATE_LIMIT_MAX_REQUESTS:3}
      rate-limit-window: ${BABY_TALK_MENTOR_RATE_LIMIT_WINDOW:PT10M}
    distribution-stats:
      default-range: ${BABY_TALK_ADMIN_DISTRIBUTION_STATS_DEFAULT_RANGE:30d}
      detail-limit: ${BABY_TALK_ADMIN_DISTRIBUTION_STATS_DETAIL_LIMIT:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 200ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
