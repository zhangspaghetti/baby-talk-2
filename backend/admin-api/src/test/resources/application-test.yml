spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

app:
  embedding:
    mode: dev-hash
