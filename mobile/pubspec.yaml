name: mobile
description: "Baby Talk 2 mobile shell"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  audioplayers: ^6.5.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  http: ^1.2.2
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  connectivity_plus: ^6.1.4
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.1
  share_plus: ^13.0.0
  app_links: ^7.0.0
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  go_router: ^14.8.1
  pinput: ^6.0.2
  confetti: ^0.8.0
  skeletonizer: ^2.1.3
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: 2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

dependency_overrides:
  win32: 5.15.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/seed_content.json
    - assets/content/care_entry_registry.json
    - assets/audio/phrases/bath_time_warm_water.mp3
    - assets/audio/phrases/bath_time_splash_splash.mp3
    - assets/audio/phrases/bath_time_all_clean.mp3
    - assets/audio/phrases/diaper_change_clean_bottom.mp3
    - assets/audio/phrases/diaper_change_all_dry.mp3
    - assets/audio/phrases/feeding_time_open_wide.mp3
    - assets/audio/phrases/feeding_time_yummy_bite.mp3
    - assets/audio/phrases/bedtime_dim_the_lights.mp3
    - assets/audio/phrases/bedtime_time_to_sleep.mp3
    - assets/audio/phrases/post_cry_im_right_here.mp3
    - assets/images/activities/
    - assets/images/baby_items/
    - assets/images/plants/
    - assets/images/emotions/
    - assets/images/mentor/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/fraunces/Fraunces-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
