targets:
  $default:
    builders:
      freezed:
        generate_for:
          include:
            - lib/features/account/domain/models/account_session.dart
            - lib/features/household/domain/models/household_invite_link.dart
            - lib/features/mentor/domain/models/local_mentor_suggestion.dart
            - lib/features/mentor/domain/models/mentor_fact_event.dart
            - lib/features/share/domain/models/share_link_draft.dart
        options:
          build_extensions:
            "^lib/features/{{}}.dart": "lib/generated/features/{{}}.freezed.dart"
      isar_generator:
        generate_for:
          include:
            - lib/features/mentor/data/local/mentor_fact_event_entity.dart
            - lib/features/practice/data/local/interaction_event_entity.dart
      source_gen|combining_builder:
        options:
          build_extensions:
            "^lib/features/{{}}.dart": "lib/generated/features/{{}}.g.dart"
      json_serializable:
        enabled: false
      riverpod_generator:
        enabled: false