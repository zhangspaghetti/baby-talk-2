name: Local act PR validation

on:
  pull_request:
    branches: [Develop]

jobs:
  local-pr-full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.local_act.head_sha }}
      ACT_FLUTTER_SOURCE: /opt/babytalk/flutter-source
      ACT_FLUTTER_ROOT: /tmp/babytalk-flutter
      PUB_CACHE: /opt/babytalk/act-cache/pub-cache
      PLAYWRIGHT_BROWSERS_PATH: /opt/babytalk/act-cache/playwright
      PNPM_STORE_DIR: /opt/babytalk/act-cache/pnpm-store
      PNPM_HOME: /opt/babytalk/act-cache/pnpm-home
      COREPACK_HOME: /opt/babytalk/act-cache/corepack
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Verify bound repository is the recorded commit
        shell: bash
        run: |
          test -d .git || {
            echo 'act must bind-mount the checked-out repository including .git' >&2
            exit 1
          }
          actual_head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" || {
            printf 'expected HEAD %s, got %s\n' "$EXPECTED_HEAD_SHA" "$actual_head_sha" >&2
            exit 1
          }
          worktree_status="$(git -c core.autocrlf=true status --porcelain=v1 --untracked-files=all)"
          test -z "$worktree_status" || {
            printf 'act bind mount became dirty before full CI:\n%s\n' "$worktree_status" >&2
            exit 1
          }
      - name: Verify host-provisioned act caches
        shell: bash
        run: |
          test -d /root/.m2 || {
            echo 'act must mount the dedicated Maven cache at /root/.m2' >&2
            exit 1
          }
          for cache_directory in "$PUB_CACHE" "$PLAYWRIGHT_BROWSERS_PATH" "$PNPM_STORE_DIR" "$PNPM_HOME" "$COREPACK_HOME"; do
            test -d "$cache_directory" && test -w "$cache_directory" || {
              printf 'act cache is unavailable or not writable: %s\n' "$cache_directory" >&2
              exit 1
            }
          done
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python CI dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Configure host-provisioned pnpm store
        run: |
          pnpm config set store-dir "$PNPM_STORE_DIR" --location=global
          test "$(pnpm config get store-dir)" = "$PNPM_STORE_DIR"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - name: Use host-provisioned Flutter SDK
        run: |
          test -x "$ACT_FLUTTER_SOURCE/bin/flutter" || {
            echo 'act must mount the host-provisioned Linux Flutter SDK' >&2
            exit 1
          }
          rm -rf "$ACT_FLUTTER_ROOT"
          mkdir -p "$ACT_FLUTTER_ROOT"
          cp -a "$ACT_FLUTTER_SOURCE/." "$ACT_FLUTTER_ROOT/"
          "$ACT_FLUTTER_ROOT/bin/flutter" --version
          printf '%s/bin\n' "$ACT_FLUTTER_ROOT" >> "$GITHUB_PATH"
          printf 'FLUTTER_ROOT=%s\n' "$ACT_FLUTTER_ROOT" >> "$GITHUB_ENV"
      - name: Run the authoritative complete local CI entrypoint
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'true'
          # The Windows bind mount and Docker Desktop's 4 GB runner can make
          # parallel jsdom workers contend for I/O and leak timed-out work into
          # neighbouring tests. Keep this local act simulation deterministic.
          VITEST_MIN_THREADS: '1'
          VITEST_MAX_THREADS: '1'
          # Chromium system libraries are built into the local, digest-based runner.
          LOCAL_ACT_RUNNER_IMAGE: 'true'
        run: bash ci/full-ci.sh
