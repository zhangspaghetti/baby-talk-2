name: Local act PR validation

on:
  pull_request:
    branches: [Develop]

jobs:
  local-pr-full-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.local_act.head_sha }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Verify bound repository is the recorded commit
        shell: bash
        run: |
          test -d .git || {
            echo 'act must bind-mount the checked-out repository including .git' >&2
            exit 1
          }
          actual_head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" || {
            printf 'expected HEAD %s, got %s\n' "$EXPECTED_HEAD_SHA" "$actual_head_sha" >&2
            exit 1
          }
          worktree_status="$(git -c core.autocrlf=true status --porcelain=v1 --untracked-files=all)"
          test -z "$worktree_status" || {
            printf 'act bind mount became dirty before full CI:\n%s\n' "$worktree_status" >&2
            exit 1
          }
      - name: Run the authoritative complete local CI entrypoint
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=core.autocrlf
          export GIT_CONFIG_VALUE_0=true
          bash ci/full-ci.sh
