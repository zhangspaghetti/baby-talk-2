<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小禾老师 FAB · C · 双模式混合</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg-paper: #FFF8F0;
    --bg-card: #FFFFFF;
    --bg-sunken: #F5F0EB;
    --text-primary: #2D2926;
    --text-secondary: #6B5E57;
    --text-hint: #8A7D76;
    --accent: #FF8C42;
    --accent-light: #FFF0E5;
    --accent-dark: #E67A30;
    --english: #3B8577;
    --english-soft: #D4E8E3;
    --success: #6B8F5E;
    --success-soft: #E8F0E5;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-sm: 0 1px 3px rgba(45,41,38,0.06);
    --shadow-md: 0 2px 12px rgba(45,41,38,0.08);
    --shadow-lg: 0 8px 24px rgba(45,41,38,0.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', 'PingFang SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--bg-sunken);
    display: flex; justify-content: center;
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone-frame {
    width: 390px; height: 844px;
    background: var(--bg-paper);
    position: relative; overflow: hidden;
  }
  .status-bar {
    display: flex; justify-content: space-between;
    padding: 14px 20px 4px; font-size: 14px; font-weight: 600;
  }
  .page-behind { padding: 16px 20px; }
  .mock-header { font-size: 20px; font-weight: 700; margin-bottom: 12px; opacity: 0.3; }
  .mock-card { height: 120px; background: var(--bg-card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: 12px; opacity: 0.15; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(45,41,38,0.3);
    z-index: 90;
    backdrop-filter: blur(2px);
  }

  /* ═══ 双模式面板 ═══ */
  .dual-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60%;
    background: var(--bg-card);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -8px 32px rgba(45,41,38,0.15);
    z-index: 100;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* 拖拽条 */
  .drag-bar {
    text-align: center; padding: 8px 0 4px;
    flex-shrink: 0;
  }
  .drag-bar span {
    display: inline-block;
    width: 36px; height: 4px;
    border-radius: 2px;
    background: #D8D0C8;
  }

  /* 模式切换标签 */
  .mode-tabs {
    display: flex; gap: 0;
    padding: 0 16px;
    border-bottom: 1.5px solid rgba(0,0,0,0.05);
    flex-shrink: 0;
  }
  .mode-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    color: var(--text-hint);
    position: relative;
    transition: all 0.2s;
  }
  .mode-tab.active {
    color: var(--english);
  }
  .mode-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1.5px; left: 20%; right: 20%;
    height: 2.5px; border-radius: 2px;
    background: var(--english);
  }

  /* ═══ 建议模式 ═══ */
  .suggest-mode {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .suggest-card {
    background: var(--bg-paper);
    border-radius: var(--radius-md);
    padding: 14px;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .suggest-card .top-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .suggest-card .scene-label {
    font-size: 12px; color: var(--text-hint);
    display: flex; align-items: center; gap: 4px;
  }
  .suggest-card .difficulty {
    font-size: 10px; padding: 2px 8px;
    border-radius: 8px; font-weight: 500;
  }
  .diff-easy { background: var(--success-soft); color: var(--success); }
  .diff-mid { background: var(--accent-light); color: var(--accent-dark); }

  .suggest-card .en {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 500;
    color: var(--english);
    line-height: 1.3;
  }
  .suggest-card .zh {
    font-size: 13px; color: var(--text-secondary);
    margin-top: 2px;
  }
  .suggest-card .actions-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
  }
  .mini-play {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--english);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .mini-play span { color: white; font-size: 12px; margin-left: 1px; }
  .ipa {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-hint);
  }
  .use-btn {
    margin-left: auto;
    padding: 6px 14px; border-radius: 12px;
    background: var(--english-soft);
    color: var(--english);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
  }

  .tip-banner {
    background: var(--accent-light);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12px; color: var(--text-secondary);
    line-height: 1.5;
    display: flex; gap: 8px;
  }
  .tip-banner .icon { font-size: 16px; flex-shrink: 0; }

  /* 底部快捷输入 */
  .bottom-input {
    padding: 8px 16px 28px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid rgba(0,0,0,0.04);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid rgba(0,0,0,0.08);
    border-radius: 20px;
    font-size: 13px;
    font-family: var(--font-body);
    background: var(--bg-paper);
    outline: none;
    color: var(--text-hint);
  }
  .chat-input:focus { border-color: var(--english); color: var(--text-primary); }
  .mic-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

  <div class="page-behind">
    <div class="mock-header">🌿 花园</div>
    <div class="mock-card"></div>
    <div class="mock-card"></div>
  </div>

  <div class="overlay"></div>

  <!-- ═══ 双模式面板 ═══ -->
  <div class="dual-panel">
    <div class="drag-bar"><span></span></div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <div class="mode-tab active">💡 建议</div>
      <div class="mode-tab">💬 聊天</div>
    </div>

    <!-- 建议模式内容 -->
    <div class="suggest-mode">
      <!-- 场景推荐1 -->
      <div class="suggest-card">
        <div class="top-row">
          <span class="scene-label">🛁 洗澡时间</span>
          <span class="difficulty diff-easy">入门</span>
        </div>
        <div class="en">"Let's take a bath!"</div>
        <div class="zh">我们来洗澡吧！</div>
        <div class="actions-row">
          <div class="mini-play"><span>▶</span></div>
          <span class="ipa">/lɛts teɪk ə bæθ/</span>
          <span class="use-btn">开始练 →</span>
        </div>
      </div>

      <!-- 场景推荐2 -->
      <div class="suggest-card">
        <div class="top-row">
          <span class="scene-label">🛁 洗澡时间</span>
          <span class="difficulty diff-mid">进阶</span>
        </div>
        <div class="en">"Can you splash the water?"</div>
        <div class="zh">你能泼水玩吗？</div>
        <div class="actions-row">
          <div class="mini-play"><span>▶</span></div>
          <span class="ipa">/kæn juː splæʃ ðə ˈwɔːtər/</span>
          <span class="use-btn">开始练 →</span>
        </div>
      </div>

      <!-- 小贴士 -->
      <div class="tip-banner">
        <span class="icon">🌱</span>
        <span>小橙子连续3天练了「洗澡」场景，尝试加入动作指令搭配效果更好哦！</span>
      </div>
    </div>

    <!-- 底部输入 -->
    <div class="bottom-input">
      <div class="mic-btn">🎤</div>
      <input class="chat-input" placeholder="切换到聊天模式提问…">
    </div>
  </div>
</div>
</body>
</html>
