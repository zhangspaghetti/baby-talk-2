<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 教练 Coach — Baby Talk 2</title>
<link rel="stylesheet" href="tokens.css">
<style>
.coach-header {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
}
.coach-header .back { font-size: 20px; color: var(--text-primary); text-decoration: none; }
.coach-header .title { font-size: 18px; font-weight: 700; flex: 1; }
.coach-header .rate-limit {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-sunken);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-md);
  padding-bottom: 140px;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

/* 消息气泡 */
.msg {
  max-width: 85%;
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-md);
  font-size: 15px;
  line-height: 1.6;
}
.msg-user {
  align-self: flex-end;
  background: var(--english-soft);
  color: var(--text-primary);
  border-bottom-right-radius: var(--space-xs);
}
.msg-coach {
  align-self: flex-start;
  background: var(--bg-surface);
  box-shadow: var(--shadow-sm);
  border-bottom-left-radius: var(--space-xs);
}
.msg-coach .coach-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: var(--space-xs);
  font-family: 'DM Sans', sans-serif;
}
.msg-coach .phrase-highlight {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 24px;
  color: var(--english);
  font-weight: 500;
  margin: var(--space-sm) 0;
  line-height: 1.3;
}
.msg-coach .phrase-zh-inline {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}
.msg-coach .tts-inline {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  background: var(--accent);
  color: white;
  border: none;
  padding: var(--space-xs) var(--space-sm);
  border-radius: var(--radius-full);
  font-size: 12px;
  cursor: pointer;
}
.msg-coach .feedback-row {
  display: flex;
  gap: var(--space-sm);
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--border);
}
.msg-coach .feedback-btn {
  font-size: 16px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* SSE 流式打字效果 */
.typing-cursor::after {
  content: '▊';
  color: var(--accent);
  animation: blink 1s infinite;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* TTS 加载状态 */
.tts-loading {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  background: var(--bg-sunken);
  color: var(--text-muted);
  padding: var(--space-xs) var(--space-sm);
  border-radius: var(--radius-full);
  font-size: 12px;
}
.tts-loading .spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Quick Ask (E7) */
.quick-asks {
  display: flex;
  gap: var(--space-xs);
  flex-wrap: wrap;
  padding: var(--space-sm) var(--space-md);
}
.quick-ask-chip {
  background: var(--accent-light);
  color: var(--accent-dark);
  border: none;
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-full);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

/* 输入区 */
.input-area {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  padding: var(--space-sm) var(--space-md) 34px;
}
.input-row {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}
.input-row input {
  flex: 1;
  padding: 10px var(--space-md);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-full);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  background: var(--bg-base);
}
.input-row input:focus { border-color: var(--accent); }
.input-row .mic-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent-light);
  border: none;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.input-row .send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 空状态 */
.empty-coach {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-2xl);
  text-align: center;
}
.empty-coach .avatar-big { font-size: 56px; margin-bottom: var(--space-md); }
.empty-coach h3 { font-size: 18px; font-weight: 600; margin-bottom: var(--space-sm); }
.empty-coach p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--space-lg); }

/* 错误状态 */
.error-banner {
  background: var(--error-soft);
  border-radius: var(--radius-sm);
  padding: var(--space-sm) var(--space-md);
  font-size: 13px;
  color: var(--error);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.back-link {
  display: inline-block;
  margin: var(--space-md);
  font-size: 13px;
  color: var(--text-muted);
  text-decoration: none;
  font-family: 'DM Sans', sans-serif;
}
</style>
</head>
<body>
<a href="index.html" class="back-link">← 返回目录</a>

<div class="phone-frame" style="display:flex; flex-direction:column;">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="coach-header">
    <a href="home.html" class="back">←</a>
    <span class="title">🤖 AI 教练</span>
    <span class="rate-limit">7/10 次</span>
  </div>

  <div class="chat-area">
    <!-- 欢迎消息 (空状态变体) -->
    <div class="msg msg-coach">
      <div class="coach-label">AI 教练</div>
      <div>你好！我是小明的英语教练 🎓 告诉我你们正在做什么，我会推荐适合说的英文短语。</div>
    </div>

    <!-- 用户消息 -->
    <div class="msg msg-user">我正在给宝宝换尿布，他一直在踢腿</div>

    <!-- 教练回复 (带短语 + TTS) -->
    <div class="msg msg-coach">
      <div class="coach-label">AI 教练</div>
      <div style="margin-bottom:var(--space-sm);">宝宝踢腿说明精力充沛！这是个好时机，试试配合他的动作：</div>
      <div class="phrase-highlight">"Kick kick kick!<br>Look at those strong legs!"</div>
      <div class="phrase-zh-inline">踢踢踢！看看这双有力的小腿！</div>
      <div style="display:flex; align-items:center; gap:var(--space-sm);">
        <button class="tts-inline">▶ 听发音</button>
        <span style="font-size:12px; color:var(--text-muted);">由 seed phrase #diaper_beginner_03 匹配</span>
      </div>
      <div class="feedback-row">
        <button class="feedback-btn">👍</button>
        <button class="feedback-btn">👎</button>
      </div>
    </div>

    <!-- 用户 Quick Ask (E7) -->
    <div class="msg msg-user">我不知道该说什么</div>

    <!-- 教练流式回复 (SSE typing) -->
    <div class="msg msg-coach">
      <div class="coach-label">AI 教练</div>
      <div>没关系！现在是什么时间？如果你们正在</div>
      <div class="tts-loading">
        <div class="spinner"></div>
        <span>正在生成语音...</span>
      </div>
    </div>

    <!-- 网络错误恢复状态 -->
    <div class="error-banner">
      ⚠️ 网络不稳定，正在重连 (2/3)...
    </div>
  </div>

  <!-- Quick Ask 快捷按钮行 (E7) -->
  <div class="quick-asks">
    <button class="quick-ask-chip">🤷 我不知道该说什么</button>
    <button class="quick-ask-chip">🛁 洗澡用语</button>
    <button class="quick-ask-chip">🍼 喂奶用语</button>
    <button class="quick-ask-chip">😴 哄睡用语</button>
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <div class="input-row">
      <button class="mic-btn">🎤</button>
      <input type="text" placeholder="描述你们正在做什么...">
      <button class="send-btn">↑</button>
    </div>
  </div>
</div>

</body>
</html>
