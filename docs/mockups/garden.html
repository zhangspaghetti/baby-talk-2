<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>花园 · C3 · 暖纸花圃</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:wght@400;500;600;700&display=swap');
  :root {
    --bg-paper: #FFF8F0;
    --bg-card: #FFFFFF;
    --bg-sunken: #F5F0EB;
    --text-primary: #2D2926;
    --text-secondary: #6B5E57;
    --text-hint: #8A7D76;
    --accent: #FF8C42;
    --accent-light: #FFF0E5;
    --english: #3B8577;
    --english-soft: #D4E8E3;
    --success: #6B8F5E;
    --success-soft: #E8F0E5;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-sm: 0 1px 3px rgba(45,41,38,0.06);
    --shadow-md: 0 2px 12px rgba(45,41,38,0.08);
    --shadow-lg: 0 8px 24px rgba(45,41,38,0.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', 'PingFang SC', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--bg-sunken);
    display: flex; justify-content: center;
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone-frame {
    width: 390px; min-height: 844px;
    background: var(--bg-paper);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px 4px; font-size: 14px; font-weight: 600;
  }

  /* ── 顶部栏 ── */
  .top-bar {
    padding: 6px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-left h1 {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .level-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-body);
    font-size: 11px; font-weight: 600;
    color: var(--success);
    background: var(--success-soft);
    padding: 3px 10px; border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.04);
    transition: box-shadow 0.15s;
  }
  .icon-btn:active { box-shadow: var(--shadow-md); }

  /* ── 统计条 ── */
  .stats-strip {
    display: flex; gap: 8px;
    padding: 0 20px 10px;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px;
    background: var(--bg-card);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    font-size: 12px; font-weight: 600;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .stat-pill .num { font-family: var(--font-display); font-size: 15px; }
  .stat-pill.streak .num { color: var(--accent); }
  .stat-pill.phrases .num { color: var(--success); }
  .stat-pill.decor .num { color: var(--english); }

  /* ══ 花园地图视口 ══ */
  .garden-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
    touch-action: none;
    border-top: 1px solid rgba(0,0,0,0.04);
  }
  .garden-viewport:active { cursor: grabbing; }

  .garden-canvas {
    width: 760px; height: 760px;
    position: absolute;
    left: -185px; top: -40px;
    /* 暖底色 + 极淡绿色调 — 不是游戏地图，是纸上的花园 */
    background: #F4EDE4;
    background-image:
      radial-gradient(circle 300px at 380px 380px, rgba(200,230,200,0.25) 0%, transparent 100%),
      radial-gradient(circle 200px at 200px 500px, rgba(200,230,200,0.15) 0%, transparent 100%),
      radial-gradient(circle 200px at 560px 250px, rgba(200,230,200,0.15) 0%, transparent 100%);
  }

  /* 纸纹理 */
  .garden-canvas::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* SVG 小路 — 柔和虚线 */
  .paths {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }
  .paths svg { width: 100%; height: 100%; }
  .path-line {
    fill: none;
    stroke: #D7CCC8;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 12, 8;
    opacity: 0.5;
  }

  /* ── 花圃卡片 ── */
  .patch {
    position: absolute; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .patch:active { transform: scale(0.94); }

  .patch-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--bg-card);
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    border: 3px solid rgba(255,255,255,0.8);
  }
  /* 进度环 */
  .patch-circle svg.ring {
    position: absolute; inset: -4px;
    width: calc(100% + 8px); height: calc(100% + 8px);
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: #EDE7E0; stroke-width: 3; }
  .ring-fill { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.3s; }
  .ring-fill.bloom { stroke: var(--success); }
  .ring-fill.growing { stroke: var(--english); }
  .ring-fill.seed { stroke: var(--accent); }

  .patch-emoji { font-size: 32px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08)); }

  .patch-label {
    margin-top: 6px;
    background: var(--bg-card);
    padding: 3px 12px;
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    font-size: 12px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .patch-sub {
    font-size: 10px; color: var(--text-hint);
    margin-top: 2px;
  }

  /* 已盛放 patch 发光 */
  .patch.bloomed .patch-circle {
    box-shadow: var(--shadow-md), 0 0 16px rgba(107,143,94,0.15);
  }

  /* 锁定 patch */
  .patch.locked { opacity: 0.4; }
  .patch.locked .patch-circle {
    background: var(--bg-sunken);
    box-shadow: var(--shadow-sm);
    border-color: rgba(0,0,0,0.04);
  }
  .patch.locked .patch-label {
    background: var(--bg-sunken);
    color: var(--text-hint);
  }

  /* ── 装饰 ── */
  .deco {
    position: absolute; pointer-events: none; z-index: 1;
    opacity: 0.35; font-size: 18px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));
  }

  /* ── 拖动提示 ── */
  .drag-hint {
    position: absolute; z-index: 20;
    top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(45,41,38,0.65);
    color: white; padding: 5px 16px; border-radius: 16px;
    font-size: 12px; font-weight: 500;
    backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .drag-hint.hide { opacity: 0; }

  /* ── 底部浮层 ── */
  .bottom-dock {
    position: absolute;
    bottom: 72px; left: 12px; right: 12px;
    z-index: 30;
    display: flex; gap: 8px;
  }
  .dock-stat {
    flex: 1;
    padding: 10px 8px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .dock-stat .dv {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 600;
  }
  .dock-stat .dl { font-size: 10px; color: var(--text-hint); margin-top: 1px; }

  .water-btn {
    padding: 0 20px;
    background: linear-gradient(135deg, var(--english), #2D7566);
    border-radius: var(--radius-md);
    box-shadow: 0 4px 16px rgba(59,133,119,0.3);
    color: white;
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform 0.1s;
  }
  .water-btn:active { transform: scale(0.96); }

  /* ── FAB ── */
  .mentor-fab {
    position: absolute; bottom: 88px; right: 16px; z-index: 100;
  }
  .fab-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--english), #2D7566);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(59,133,119,0.35);
    cursor: pointer; border: 3px solid white;
  }
  .fab-badge {
    position: absolute; top: -2px; right: -2px;
    width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%; border: 2px solid white;
  }

  /* ── 底部导航 ── */
  .bottom-nav {
    position: sticky; bottom: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.06);
    display: flex; padding: 8px 0 28px; z-index: 50;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 3px; padding-top: 6px; cursor: pointer;
  }
  .nav-icon { font-size: 20px; opacity: 0.35; }
  .nav-label { font-size: 10px; color: var(--text-hint); }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-item.active .nav-label { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

  <!-- 顶部 -->
  <div class="top-bar">
    <div class="top-left">
      <h1>我的花园 <span class="level-pill">🌱 Lv.2</span></h1>
    </div>
    <div class="top-actions">
      <div class="icon-btn">👥</div>
      <div class="icon-btn">📷</div>
    </div>
  </div>

  <!-- 统计条 -->
  <div class="stats-strip">
    <div class="stat-pill streak"><span class="num">5</span> 天连续</div>
    <div class="stat-pill phrases"><span class="num">38</span> 短语</div>
    <div class="stat-pill decor"><span class="num">3</span> 装饰</div>
  </div>

  <!-- ═══ 花园地图 ═══ -->
  <div class="garden-viewport" id="viewport">
    <div class="garden-canvas" id="canvas">
      
      <!-- 小路 -->
      <div class="paths">
        <svg viewBox="0 0 760 760">
          <path class="path-line" d="M 380 140 Q 300 230, 220 300"/>
          <path class="path-line" d="M 380 140 Q 460 230, 520 280"/>
          <path class="path-line" d="M 220 300 Q 260 400, 380 420"/>
          <path class="path-line" d="M 520 280 Q 470 380, 380 420"/>
          <path class="path-line" d="M 380 420 Q 300 500, 230 560"/>
          <path class="path-line" d="M 380 420 Q 460 500, 530 560"/>
          <path class="path-line" d="M 230 560 Q 310 620, 380 640"/>
          <path class="path-line" d="M 530 560 Q 460 620, 380 640"/>
        </svg>
      </div>

      <!-- 装饰 -->
      <span class="deco" style="top:100px;left:100px;font-size:22px;">🌳</span>
      <span class="deco" style="top:200px;left:620px;font-size:20px;">🌳</span>
      <span class="deco" style="top:340px;left:80px;font-size:14px;">🦋</span>
      <span class="deco" style="top:520px;left:620px;font-size:14px;">🐝</span>
      <span class="deco" style="top:660px;left:120px;font-size:16px;">🪨</span>
      <span class="deco" style="top:180px;left:380px;font-size:12px;">🌿</span>
      <span class="deco" style="top:480px;left:160px;font-size:12px;">🌿</span>

      <!-- ╔═ 花圃们 ═╗ -->
      
      <!-- 盛放：睡前时光 5/5 -->
      <div class="patch bloomed" style="top:90px;left:340px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill bloom" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="0"/>
          </svg>
          <span class="patch-emoji">🌸</span>
        </div>
        <span class="patch-label">睡前时光</span>
        <span class="patch-sub">5/5 盛放 ✨</span>
      </div>

      <!-- 生长中：洗澡 3/5 -->
      <div class="patch" style="top:250px;left:170px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill growing" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="100"/>
          </svg>
          <span class="patch-emoji">🌻</span>
        </div>
        <span class="patch-label">洗澡</span>
        <span class="patch-sub">3/5 生长中</span>
      </div>

      <!-- 发芽：吃饭 2/5 -->
      <div class="patch" style="top:230px;left:480px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill growing" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="150"/>
          </svg>
          <span class="patch-emoji">🌱</span>
        </div>
        <span class="patch-label">吃饭</span>
        <span class="patch-sub">2/5 发芽</span>
      </div>

      <!-- 种子：穿衣 1/5 -->
      <div class="patch" style="top:370px;left:330px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill seed" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="200"/>
          </svg>
          <span class="patch-emoji">🫘</span>
        </div>
        <span class="patch-label">穿衣</span>
        <span class="patch-sub">1/5 播种</span>
      </div>

      <!-- 需要拖动才能看到的区域 -->
      <!-- 生长中：玩耍 4/5 -->
      <div class="patch" style="top:510px;left:180px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill growing" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="50"/>
          </svg>
          <span class="patch-emoji">🌷</span>
        </div>
        <span class="patch-label">玩耍</span>
        <span class="patch-sub">4/5 快开花了</span>
      </div>

      <!-- 发芽：户外 1/5 -->
      <div class="patch" style="top:510px;left:490px;">
        <div class="patch-circle">
          <svg class="ring" viewBox="0 0 88 88">
            <circle class="ring-bg" cx="44" cy="44" r="40"/>
            <circle class="ring-fill seed" cx="44" cy="44" r="40"
              stroke-dasharray="251" stroke-dashoffset="200"/>
          </svg>
          <span class="patch-emoji">🌿</span>
        </div>
        <span class="patch-label">户外</span>
        <span class="patch-sub">1/5 播种</span>
      </div>

      <!-- 锁定 -->
      <div class="patch locked" style="top:600px;left:330px;">
        <div class="patch-circle">
          <span class="patch-emoji">🔒</span>
        </div>
        <span class="patch-label">故事</span>
        <span class="patch-sub">阶段 3 解锁</span>
      </div>

    </div>

    <div class="drag-hint" id="hint">☝️ 拖动探索花园</div>
  </div>

  <!-- 底部信息 -->
  <div class="bottom-dock">
    <div class="dock-stat">
      <div class="dv" style="color:var(--accent);">5</div>
      <div class="dl">🔥 连续</div>
    </div>
    <div class="dock-stat">
      <div class="dv" style="color:var(--success);">38</div>
      <div class="dl">🌸 短语</div>
    </div>
    <div class="water-btn">💧 浇水</div>
  </div>

  <div class="mentor-fab">
    <div class="fab-btn">🌿<div class="fab-badge"></div></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">首页</span></div>
    <div class="nav-item"><span class="nav-icon">🔍</span><span class="nav-label">发现</span></div>
    <div class="nav-item active"><span class="nav-icon">🌱</span><span class="nav-label">花园</span></div>
    <div class="nav-item"><span class="nav-icon">📊</span><span class="nav-label">成长</span></div>
    <div class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">我的</span></div>
  </div>
</div>

<script>
const vp = document.getElementById('viewport');
const cv = document.getElementById('canvas');
const hint = document.getElementById('hint');
let drag = false, sx, sy, sl, st;

function pos() {
  return { l: parseInt(cv.style.left) || -185, t: parseInt(cv.style.top) || -40 };
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function down(x, y) {
  drag = true;
  const p = pos();
  sx = x; sy = y; sl = p.l; st = p.t;
  hint.classList.add('hide');
}
function move(x, y) {
  if (!drag) return;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  cv.style.left = clamp(sl + (x - sx), -(760 - vw), 0) + 'px';
  cv.style.top = clamp(st + (y - sy), -(760 - vh + 80), 0) + 'px';
}
function up() { drag = false; }

vp.addEventListener('mousedown', e => down(e.clientX, e.clientY));
addEventListener('mousemove', e => move(e.clientX, e.clientY));
addEventListener('mouseup', up);
vp.addEventListener('touchstart', e => { const t=e.touches[0]; down(t.clientX, t.clientY); });
vp.addEventListener('touchmove', e => { const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
vp.addEventListener('touchend', up);
</script>
</body>
</html>
