<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庆祝屏 Celebration — Baby Talk 2</title>
<link rel="stylesheet" href="tokens.css">
<style>
body { background: var(--bg-base); }

.phone-frame {
  background: linear-gradient(170deg, #FFF8F0 0%, #FFF0E5 40%, #D4E8E3 100%);
  overflow: hidden;
}

/* 粒子浮动 */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  font-size: 24px;
  animation: float-up 3s ease-out infinite;
  opacity: 0;
}
@keyframes float-up {
  0% { opacity: 0; transform: translateY(100px) scale(0.5) rotate(0deg); }
  20% { opacity: 1; }
  80% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-600px) scale(1.2) rotate(180deg); }
}

/* 主内容 */
.celebration-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-2xl);
  text-align: center;
  z-index: 10;
}
.big-emoji {
  font-size: 80px;
  margin-bottom: var(--space-lg);
  animation: emoji-bounce 1s ease-out;
}
@keyframes emoji-bounce {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
.celebration-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 32px;
  font-weight: 500;
  color: var(--english);
  line-height: 1.2;
  margin-bottom: var(--space-sm);
}
.celebration-subtitle {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: var(--space-sm);
}
.celebration-desc {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: var(--space-xl);
  max-width: 280px;
}
.celebration-phrase {
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: var(--space-xl);
}
.celebration-phrase .en {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px;
  color: var(--english);
  font-weight: 500;
  margin-bottom: var(--space-xs);
}
.celebration-phrase .zh {
  font-size: 14px;
  color: var(--text-muted);
}

/* 分享按钮 (E6) */
.share-section {
  width: 100%;
  max-width: 280px;
}
.share-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: var(--space-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
}
.share-copy-preview {
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  padding: var(--space-sm) var(--space-md);
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
  text-align: left;
  border: 1px dashed var(--border);
}
.skip-btn {
  margin-top: var(--space-md);
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
}

.back-link {
  display: inline-block;
  margin: var(--space-md);
  font-size: 13px;
  color: var(--text-muted);
  text-decoration: none;
  font-family: 'DM Sans', sans-serif;
}
</style>
</head>
<body>
<a href="index.html" class="back-link">← 返回目录</a>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <!-- 粒子效果 -->
  <div class="particles">
    <div class="particle" style="left:10%; animation-delay:0s;">⭐</div>
    <div class="particle" style="left:25%; animation-delay:0.5s;">🌟</div>
    <div class="particle" style="left:50%; animation-delay:0.2s;">✨</div>
    <div class="particle" style="left:70%; animation-delay:0.8s;">🎉</div>
    <div class="particle" style="left:85%; animation-delay:0.4s;">⭐</div>
    <div class="particle" style="left:40%; animation-delay:1.2s;">💫</div>
    <div class="particle" style="left:60%; animation-delay:1.5s;">🌟</div>
    <div class="particle" style="left:15%; animation-delay:1.8s;">✨</div>
    <div class="particle" style="left:80%; animation-delay:2.0s;">🎉</div>
  </div>

  <!-- 主内容 -->
  <div class="celebration-content">
    <div class="big-emoji">🎉</div>
    <div class="celebration-title">First Babble!</div>
    <div class="celebration-subtitle">小明的第一次咿呀学语！</div>
    <div class="celebration-desc">在洗澡时间，你说了 "Splash splash!" 之后，小明发出了咿呀的声音。这是一个美好的开始！</div>

    <!-- 触发短语 -->
    <div class="celebration-phrase">
      <div class="en">"Splash splash!"</div>
      <div class="zh">🛁 洗澡时间 · 初级</div>
    </div>

    <!-- 分享 (E6) -->
    <div class="share-section">
      <button class="share-btn">
        <span>📲</span>
        <span>分享到微信</span>
      </button>
      <!-- 分享文案预览 -->
      <div class="share-copy-preview">
        预览文案：小明今天听到 "Splash splash!" 第一次发出了咿呀声！🎉 我们在用 Baby Talk 记录宝宝的英语启蒙旅程 💪
      </div>
      <button class="skip-btn">以后再说</button>
    </div>
  </div>
</div>

</body>
</html>
