<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>庆祝屏 · A · 经典单屏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg-paper: #FFF8F0;
    --bg-card: #FFFFFF;
    --bg-sunken: #F5F0EB;
    --text-primary: #2D2926;
    --text-secondary: #6B5E57;
    --text-hint: #8A7D76;
    --accent: #FF8C42;
    --accent-light: #FFF0E5;
    --english: #3B8577;
    --english-soft: #D4E8E3;
    --success: #6B8F5E;
    --success-soft: #E8F0E5;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-md: 0 2px 12px rgba(45,41,38,0.08);
    --shadow-lg: 0 8px 24px rgba(45,41,38,0.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', 'PingFang SC', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--bg-sunken);
    display: flex; justify-content: center;
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone-frame {
    width: 390px; height: 844px;
    background: linear-gradient(170deg, #FFF8F0 0%, #FFF0E5 40%, #D4E8E3 100%);
    position: relative; overflow: hidden;
  }
  .status-bar {
    display: flex; justify-content: space-between;
    padding: 14px 20px 4px; font-size: 14px; font-weight: 600;
    position: relative; z-index: 20;
  }

  /* ═══ 粒子 ═══ */
  .particles { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .p {
    position: absolute; font-size: 22px;
    animation: rise 3.5s ease-out forwards;
    opacity: 0;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(80px) scale(0.4) rotate(0deg); }
    15% { opacity: 1; }
    80% { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-650px) scale(1.1) rotate(200deg); }
  }

  /* ═══ 主内容 ═══ */
  .content {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 28px;
    text-align: center;
  }

  /* 大emoji弹入 */
  .hero-emoji {
    font-size: 72px;
    margin-bottom: 16px;
    animation: pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .title {
    font-family: var(--font-display);
    font-size: 30px; font-weight: 500;
    color: var(--english);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .subtitle {
    font-size: 17px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .desc {
    font-size: 14px; color: var(--text-secondary);
    line-height: 1.6;
    max-width: 280px;
    margin-bottom: 20px;
  }

  /* 触发短语卡 */
  .phrase-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 14px 20px;
    box-shadow: var(--shadow-md);
    margin-bottom: 20px;
    width: 100%; max-width: 280px;
  }
  .phrase-card .en {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500;
    color: var(--english);
  }
  .phrase-card .meta {
    font-size: 12px; color: var(--text-hint);
    margin-top: 4px;
  }

  /* ═══ 成就解锁 ═══ */
  .unlock-section {
    width: 100%; max-width: 300px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(59,133,119,0.15);
  }
  .unlock-header {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase;
    color: var(--success);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 4px;
  }
  .unlock-items {
    display: flex; gap: 12px;
    justify-content: center;
  }
  .unlock-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .unlock-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    position: relative;
  }
  .unlock-icon.garden {
    background: var(--english-soft);
    border: 2px solid var(--english);
  }
  .unlock-icon.badge {
    background: var(--accent-light);
    border: 2px solid var(--accent);
  }
  .unlock-icon .new {
    position: absolute; top: -3px; right: -3px;
    font-size: 8px; font-weight: 700;
    background: var(--accent);
    color: white;
    padding: 1px 5px;
    border-radius: 6px;
  }
  .unlock-label {
    font-size: 11px; color: var(--text-secondary);
    font-weight: 500;
  }

  /* ═══ 下一步 ═══ */
  .actions {
    width: 100%; max-width: 280px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px; font-weight: 600;
    font-family: var(--font-body);
    cursor: pointer;
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
    box-shadow: 0 4px 12px rgba(255,140,66,0.3);
  }
  .btn-secondary {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(0,0,0,0.06);
    color: var(--text-secondary);
    font-size: 14px; font-weight: 500;
    font-family: var(--font-body);
    cursor: pointer;
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .btn-ghost {
    background: none; border: none;
    color: var(--text-hint); font-size: 13px;
    cursor: pointer; margin-top: 4px;
    font-family: var(--font-body);
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

  <!-- 粒子 -->
  <div class="particles">
    <div class="p" style="left:8%; animation-delay:0s;">⭐</div>
    <div class="p" style="left:22%; animation-delay:0.4s;">🌟</div>
    <div class="p" style="left:45%; animation-delay:0.2s;">✨</div>
    <div class="p" style="left:65%; animation-delay:0.7s;">🎉</div>
    <div class="p" style="left:82%; animation-delay:0.3s;">⭐</div>
    <div class="p" style="left:35%; animation-delay:1.0s;">💫</div>
    <div class="p" style="left:55%; animation-delay:1.4s;">🌟</div>
    <div class="p" style="left:12%; animation-delay:1.7s;">✨</div>
    <div class="p" style="left:75%; animation-delay:2.0s;">🎉</div>
    <div class="p" style="left:90%; animation-delay:2.3s;">💫</div>
  </div>

  <div class="content">
    <div class="hero-emoji">🎉</div>
    <div class="title">First Babble!</div>
    <div class="subtitle">小橙子的第一次咿呀！</div>
    <div class="desc">洗澡时你说了 "Splash splash!"，小橙子发出了咿呀的回应。每一个声音都是奇迹 🌱</div>

    <div class="phrase-card">
      <div class="en">"Splash splash!"</div>
      <div class="meta">🛁 洗澡时间 · 入门</div>
    </div>

    <!-- 解锁区 -->
    <div class="unlock-section">
      <div class="unlock-header">🔓 解锁成就</div>
      <div class="unlock-items">
        <div class="unlock-item">
          <div class="unlock-icon garden">🌸<span class="new">NEW</span></div>
          <span class="unlock-label">洗澡花圃</span>
        </div>
        <div class="unlock-item">
          <div class="unlock-icon badge">🏅<span class="new">NEW</span></div>
          <span class="unlock-label">语音启蒙者</span>
        </div>
      </div>
    </div>

    <!-- 下一步 -->
    <div class="actions">
      <button class="btn-primary">🌿 去花园看看 →</button>
      <button class="btn-secondary">📲 分享到微信</button>
      <button class="btn-ghost">回到首页</button>
    </div>
  </div>
</div>
</body>
</html>
