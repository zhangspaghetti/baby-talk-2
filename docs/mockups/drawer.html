<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 · A2 · 经典菜单+快数据条</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg-paper: #FFF8F0;
    --bg-card: #FFFFFF;
    --bg-sunken: #F5F0EB;
    --text-primary: #2D2926;
    --text-secondary: #6B5E57;
    --text-hint: #8A7D76;
    --accent: #FF8C42;
    --accent-light: #FFF0E5;
    --english: #3B8577;
    --english-soft: #D4E8E3;
    --success: #6B8F5E;
    --success-soft: #E8F0E5;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow-sm: 0 1px 3px rgba(45,41,38,0.06);
    --shadow-md: 0 2px 12px rgba(45,41,38,0.08);
    --shadow-lg: 0 8px 24px rgba(45,41,38,0.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', 'PingFang SC', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--bg-sunken);
    display: flex; justify-content: center;
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone-frame {
    width: 390px; height: 844px;
    background: var(--bg-paper);
    position: relative; overflow: hidden;
  }
  .status-bar {
    display: flex; justify-content: space-between;
    padding: 14px 20px 4px; font-size: 14px; font-weight: 600;
    position: relative; z-index: 10;
  }

  /* 底层（模糊的首页） */
  .page-behind {
    padding: 16px 20px; opacity: 0.2;
  }
  .mock-card {
    height: 100px; background: var(--bg-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }

  /* 遮罩 */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(45,41,38,0.35);
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  /* ═══ 抽屉 ═══ */
  .drawer {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 310px;
    background: var(--bg-card);
    z-index: 60;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 32px rgba(45,41,38,0.15);
    animation: slideRight 0.25s ease-out;
  }
  @keyframes slideRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  /* 头部 */
  .drawer-header {
    padding: 52px 20px 20px;
    background: linear-gradient(135deg, var(--bg-paper) 0%, #FFF0E5 100%);
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .profile-row {
    display: flex; align-items: center; gap: 14px;
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    border: 2px solid white;
    box-shadow: var(--shadow-sm);
  }
  .profile-info { flex: 1; }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-phone {
    font-size: 12px; color: var(--text-hint);
    font-family: var(--font-mono);
  }
  .edit-btn {
    font-size: 12px; color: var(--english);
    font-weight: 500; cursor: pointer;
  }

  /* 宝宝卡 */
  .baby-card {
    margin: 12px 20px 0;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    border: 1px solid rgba(0,0,0,0.04);
    display: flex; align-items: center; gap: 10px;
  }
  .baby-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--english-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .baby-info { flex: 1; }
  .baby-name { font-size: 14px; font-weight: 600; }
  .baby-meta { font-size: 11px; color: var(--text-hint); }
  .baby-change {
    font-size: 11px; color: var(--text-hint);
    cursor: pointer;
  }

  /* 快数据条 */
  .quick-stats {
    display: flex; gap: 6px;
    margin: 10px 20px 0;
  }
  .qs-item {
    flex: 1;
    background: var(--bg-paper);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    text-align: center;
  }
  .qs-item .val {
    font-size: 18px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .qs-item .lbl { font-size: 10px; color: var(--text-hint); margin-top: 1px; }

  /* 菜单列表 */
  .menu {
    flex: 1; overflow-y: auto;
    padding: 8px 0;
  }
  .menu-section {
    padding: 12px 20px 4px;
    font-size: 11px; font-weight: 700;
    color: var(--text-hint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .menu-item:active { background: var(--bg-sunken); }
  .menu-item .mi-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .mi-orange { background: var(--accent-light); }
  .mi-teal { background: var(--english-soft); }
  .mi-green { background: var(--success-soft); }
  .mi-gray { background: var(--bg-sunken); }
  .menu-item .mi-text { flex: 1; font-size: 15px; }
  .menu-item .mi-trail {
    font-size: 12px; color: var(--text-hint);
  }
  .menu-item .mi-badge {
    font-size: 10px; font-weight: 600;
    background: var(--accent);
    color: white;
    padding: 1px 7px;
    border-radius: 8px;
  }
  .menu-divider {
    height: 1px;
    background: rgba(0,0,0,0.04);
    margin: 4px 20px;
  }

  /* 底部 */
  .drawer-footer {
    padding: 12px 20px 28px;
    border-top: 1px solid rgba(0,0,0,0.04);
    display: flex; justify-content: space-between;
    align-items: center;
  }
  .version { font-size: 11px; color: var(--text-hint); font-family: var(--font-mono); }
  .logout { font-size: 13px; color: var(--text-hint); cursor: pointer; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

  <div class="page-behind">
    <div class="mock-card"></div>
    <div class="mock-card"></div>
    <div class="mock-card"></div>
  </div>

  <div class="overlay"></div>

  <!-- ═══ 抽屉（右侧） ═══ -->
  <div class="drawer">
    <div class="drawer-header">
      <div class="profile-row">
        <div class="avatar">👩</div>
        <div class="profile-info">
          <div class="profile-name">小橙子妈妈</div>
          <div class="profile-phone">138****5678</div>
        </div>
        <span class="edit-btn">编辑 ›</span>
      </div>
    </div>

    <div class="baby-card">
      <div class="baby-avatar">👶</div>
      <div class="baby-info">
        <div class="baby-name">小橙子</div>
        <div class="baby-meta">8个月 · 阶段2 · 第12天</div>
      </div>
      <span class="baby-change">切换 ›</span>
    </div>

    <!-- 快数据条 -->
    <div class="quick-stats">
      <div class="qs-item">
        <div class="val" style="color:var(--accent);">12</div>
        <div class="lbl">天打卡</div>
      </div>
      <div class="qs-item">
        <div class="val" style="color:var(--english);">21</div>
        <div class="lbl">短语</div>
      </div>
      <div class="qs-item">
        <div class="val" style="color:var(--success);">3</div>
        <div class="lbl">徽章</div>
      </div>
    </div>

    <div class="menu">
      <div class="menu-section">数据报告</div>
      <div class="menu-item">
        <div class="mi-icon mi-orange">📊</div>
        <span class="mi-text">月度报告</span>
        <span class="mi-badge">NEW</span>
      </div>
      <div class="menu-item">
        <div class="mi-icon mi-teal">🌙</div>
        <span class="mi-text">晚安小结</span>
        <span class="mi-trail">每日 21:00</span>
      </div>

      <div class="menu-divider"></div>
      <div class="menu-section">设置</div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">🔔</div>
        <span class="mi-text">推送提醒</span>
        <span class="mi-trail">每日 18:00</span>
      </div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">🎚</div>
        <span class="mi-text">难度偏好</span>
        <span class="mi-trail">自动</span>
      </div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">🗣</div>
        <span class="mi-text">发音偏好</span>
        <span class="mi-trail">美式</span>
      </div>

      <div class="menu-divider"></div>
      <div class="menu-section">其他</div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">💬</div>
        <span class="mi-text">客服反馈</span>
      </div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">📋</div>
        <span class="mi-text">隐私政策</span>
      </div>
      <div class="menu-item">
        <div class="mi-icon mi-gray">ℹ️</div>
        <span class="mi-text">关于</span>
      </div>
    </div>

    <div class="drawer-footer">
      <span class="version">v1.0.0</span>
      <span class="logout">退出登录</span>
    </div>
  </div>
</div>
</body>
</html>
